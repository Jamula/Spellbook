name: Build Spellbook
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Spellbook/Spellbook.csproj
      - name: Build
        run: dotnet build Spellbook/Spellbook.csproj --configuration Release --no-restore
      - name: Publish static site
        run: dotnet publish Spellbook/Spellbook.csproj --configuration Release --no-restore --output publish
      - name: Check deployable site exists
        run: test -f publish/wwwroot/index.html && test -f publish/wwwroot/_framework/blazor.boot.json
      - name: Upload static site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spellbook-site
          path: publish/wwwroot
          if-no-files-found: error
