name: Reconcile main CI
on:
  workflow_run:
    workflows: [Build Spellbook, Enable auto-merge]
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: reconcile-main-ci
  cancel-in-progress: false
permissions:
  contents: read
  actions: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # workflow_run can originate at a fork: always check out trusted main,
      # never the triggering SHA, PR branch, or downloaded PR artifacts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Dispatch only a missing default-branch build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/release-tools/reconcile.py
